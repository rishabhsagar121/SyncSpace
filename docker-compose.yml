version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: syncspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: syncspace
    ports:
      - '5432:5432'
    volumes:
      - syncspace_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: syncspace-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - syncspace_redis_data:/data

volumes:
  syncspace_postgres_data:
  syncspace_redis_data: